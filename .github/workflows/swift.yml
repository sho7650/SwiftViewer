# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: Build
      run: |
        xcodebuild -scheme YourSchemeName -sdk macosx -configuration Release build

    - name: Run Tests
      run: |
        xcodebuild -scheme YourSchemeName -sdk macosx -configuration Release test
