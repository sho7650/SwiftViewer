# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: Cache DerivedData
      uses: actions/cache@v4
      with:
        path: ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-xcode-${{ hashFiles('**/*.swift') }}
        restore-keys: |
          ${{ runner.os }}-xcode-

    - name: Build for Release
      run: |
        xcodebuild \
          -scheme SwiftViewer \
          -sdk macosx \
          -destination "platform=macOS,arch=arm64" \
          -configuration Release \
          -derivedDataPath ~/Library/Developer/Xcode/DerivedData \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          ONLY_ACTIVE_ARCH=NO \
          build

    - name: Run Unit Tests with Known Issues Filtering
      run: |
        set +e  # Don't exit on test failures - we'll handle them below
        
        # Run tests with output capture
        xcodebuild \
          -scheme SwiftViewer \
          -sdk macosx \
          -destination "platform=macOS,arch=arm64" \
          -configuration Debug \
          -derivedDataPath ~/Library/Developer/Xcode/DerivedData \
          -only-testing SwiftViewerTests \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          ONLY_ACTIVE_ARCH=NO \
          test 2>&1 | tee test_output.log
        
        TEST_EXIT_CODE=${PIPESTATUS[0]}
        
        # Process test output to separate Known Issues from real failures
        echo "=== Processing Test Results ==="
        
        # Extract Known Issues (these are expected)
        echo "=== Known Issues (Expected) ==="
        grep -i "withKnownIssue\|Known Issue" test_output.log || echo "No Known Issues found"
        
        # Filter out known logging patterns that are intentional
        echo "=== Filtering Test Output ==="
        grep -v "\[DEBUG\]" test_output.log | \
        grep -v "\[INFO\]" | \
        grep -v "\[WARNING\]" | \
        grep -v "\[ERROR\]" | \
        grep -v "Logger.*test.*message" | \
        grep -E "(FAIL|ERROR|Test.*failed)" > filtered_failures.log || true
        
        # Show real failures (if any)
        if [ -s filtered_failures.log ]; then
          echo "=== Real Test Failures (Needs Investigation) ==="
          cat filtered_failures.log
          echo "=== End Real Failures ==="
        else
          echo "=== No Real Test Failures Found ==="
        fi
        
        # Show test summary
        echo "=== Test Summary ==="
        grep -E "(Test Suite|tests ran|failures|errors)" test_output.log || echo "No test summary available"
        
        # Exit with original test exit code
        exit $TEST_EXIT_CODE

    - name: Upload Test Artifacts
      uses: actions/upload-artifact@v4
      if: always()  # Upload artifacts even if tests fail
      with:
        name: test-results
        path: |
          test_output.log
          filtered_failures.log
        retention-days: 30

    - name: Upload Swift Testing Attachments
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: swift-testing-attachments
        path: |
          **/*log*.txt
          **/*attachment*.txt
        retention-days: 7
        if-no-files-found: ignore
