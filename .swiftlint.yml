line_length:
  warning: 200
  error: 300

file_length:
  warning: 400
  error: 800

function_body_length:
  warning: 50
  error: 80

type_body_length:
  warning: 400
  error: 800

nesting:
  type_level:
    warning: 3
  function_level:
    warning: 4

force_unwrapping:
  severity: error

force_cast:
  severity: error

force_try:
  severity: error

excluded:
  - build/
  - .build/
  - Pods/
  - DerivedData/
  - .swiftpm/
